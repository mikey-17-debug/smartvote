# nginx 站点配置（课堂评分投票系统 · 静态原型）
# 挂载到容器 /etc/nginx/conf.d/default.conf

server {
    listen       80;
    server_name  localhost;

    charset utf-8;
    root  /usr/share/nginx/html;
    index index.html;

    # 开发阶段一律不缓存，改完 html/js 直接刷新就生效
    add_header Cache-Control "no-store";

    location / {
        try_files $uri $uri/ =404;
    }

    # mock 假数据按 JSON 返回，避免中文被当成文本猜测编码
    location ~* \.json$ {
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # 隐藏文件不对外（.git 等）
    location ~ /\. {
        deny all;
    }
}
