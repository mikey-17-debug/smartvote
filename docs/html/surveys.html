<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>问卷管理 · 课堂评分投票系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f3f4fa] text-slate-800">
  <div class="flex min-h-screen">
    <aside id="sidebar"></aside>
    <main class="min-w-0 flex-1">
      <div id="page" class="mx-auto max-w-5xl px-6 py-10">
        <header class="flex flex-wrap items-end justify-between gap-4">
          <div>
            <h1 class="text-2xl font-semibold tracking-tight text-slate-900">问卷管理</h1>
            <p class="mt-1 text-sm text-slate-500">从题库组卷、开放投票并查看统计。</p>
          </div>
          <a href="survey-new.html"
            class="inline-flex items-center gap-1.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-4 py-2 text-sm font-medium text-white shadow-sm shadow-indigo-600/25 transition hover:from-indigo-500 hover:to-violet-500 active:scale-[.98]">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
            </svg>
            新增问卷
          </a>
        </header>

        <div id="list" class="mt-7 space-y-4"></div>
      </div>
    </main>
  </div>

  <script src="assets/app.js"></script>
  <script>
    let db = null;

    function render() {
      const list = document.getElementById("list");
      if (!db.surveys.length) {
        list.innerHTML = `
          <div class="rounded-2xl border border-dashed border-slate-300 bg-white/60 p-12 text-center">
            <p class="text-sm text-slate-500">还没有问卷</p>
            <a href="survey-new.html" class="mt-3 inline-block text-sm font-medium text-indigo-600 transition hover:text-indigo-500">创建第一份问卷 →</a>
          </div>`;
        return;
      }

      list.innerHTML = db.surveys.map((survey) => {
        const voteCount = surveyVotes(db, survey.id).length;
        const statusBadge = survey.isOpen
          ? '<span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-2.5 py-1 text-xs font-medium text-emerald-600"><span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>进行中</span>'
          : '<span class="inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-500"><span class="h-1.5 w-1.5 rounded-full bg-slate-400"></span>已关闭</span>';
        const url = voteUrl(survey.id);

        return `
          <article class="qc-fade rounded-2xl border border-slate-200/80 bg-white p-5 shadow-sm transition duration-200 hover:-translate-y-0.5 hover:shadow-lg hover:shadow-indigo-600/5">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div class="min-w-0">
                <div class="flex flex-wrap items-center gap-2">
                  <h2 class="text-base font-semibold text-slate-900">${escapeHtml(survey.title)}</h2>
                  ${statusBadge}
                </div>
                <p class="mt-1 text-sm text-slate-500">${escapeHtml(survey.description || "暂无说明")}</p>
              </div>
              <div class="flex shrink-0 flex-wrap items-center gap-2">
                <a href="survey-edit.html?id=${encodeURIComponent(survey.id)}"
                  class="rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-sm text-slate-600 shadow-sm transition hover:border-slate-300 hover:text-slate-900">编辑</a>
                <a href="stats.html?id=${encodeURIComponent(survey.id)}"
                  class="rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-sm text-slate-600 shadow-sm transition hover:border-slate-300 hover:text-slate-900">统计</a>
                <a href="${escapeHtml(url)}" target="_blank" rel="noopener"
                  class="rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-3 py-1.5 text-sm font-medium text-white shadow-sm shadow-indigo-600/25 transition hover:from-indigo-500 hover:to-violet-500">前台投票</a>
              </div>
            </div>

            <div class="mt-3.5 flex flex-wrap items-center gap-x-4 gap-y-1.5 text-xs text-slate-500">
              <span>${survey.questionIds.length} 道题</span>
              <span>${voteCount} 人已提交</span>
              <span>创建于 ${formatTime(survey.createdAt)}</span>
            </div>

            <div class="mt-3.5 flex items-center gap-2 rounded-xl bg-slate-50 px-3 py-2 ring-1 ring-inset ring-slate-200/70">
              <svg class="h-3.5 w-3.5 shrink-0 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 010 5.656l-3 3a4 4 0 01-5.656-5.656l1.5-1.5M10.172 13.828a4 4 0 010-5.656l3-3a4 4 0 015.656 5.656l-1.5 1.5"/>
              </svg>
              <code class="min-w-0 flex-1 truncate text-xs text-slate-500">${escapeHtml(url)}</code>
              <button type="button" data-url="${escapeHtml(url)}"
                class="copy-btn shrink-0 rounded-lg border border-slate-200 bg-white px-2.5 py-1 text-xs text-slate-600 transition hover:border-slate-300 hover:text-slate-900">复制</button>
            </div>
          </article>`;
      }).join("");

      list.querySelectorAll(".copy-btn").forEach((btn) => {
        btn.addEventListener("click", () => copyText(btn.dataset.url));
      });
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        notify("问卷地址已复制");
      } catch (err) {
        notify("复制失败，请手动选中地址复制", "error");
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      if (!mountAdmin("surveys")) return;
      consumeFlash();
      try {
        db = await loadDB();
        render();
      } catch (err) {
        showFatal(err);
      }
    });
  </script>
</body>
</html>
