<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>编辑题目 · 课堂评分投票系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f3f4fa] text-slate-800">
  <div class="flex min-h-screen">
    <aside id="sidebar"></aside>
    <main class="min-w-0 flex-1">
      <div id="page" class="mx-auto max-w-3xl px-6 py-10">
        <a href="questions.html" class="text-sm text-slate-500 transition hover:text-indigo-600">← 返回题库</a>
        <h1 class="mt-3 text-2xl font-semibold tracking-tight text-slate-900">编辑题目</h1>
        <p id="usage-hint" class="mt-1 text-sm text-slate-500"></p>

        <form id="question-form" class="qc-fade mt-7 space-y-5 rounded-2xl border border-slate-200/80 bg-white p-7 shadow-sm">
          <div>
            <label for="title" class="block text-sm font-medium text-slate-700">题目标题 <span class="text-rose-500">*</span></label>
            <input id="title" type="text" required maxlength="80"
              class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm shadow-sm outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10" />
          </div>

          <div>
            <label for="description" class="block text-sm font-medium text-slate-700">题目说明</label>
            <textarea id="description" rows="3" maxlength="200"
              class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm shadow-sm outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"></textarea>
          </div>

          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <label for="scoreMin" class="block text-sm font-medium text-slate-700">分值下限</label>
              <input id="scoreMin" type="number" min="0" max="100" step="1"
                class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm shadow-sm outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10" />
            </div>
            <div>
              <label for="scoreMax" class="block text-sm font-medium text-slate-700">分值上限</label>
              <input id="scoreMax" type="number" min="1" max="100" step="1"
                class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm shadow-sm outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10" />
            </div>
          </div>

          <p id="error" class="hidden rounded-xl border border-rose-100 bg-rose-50 px-3 py-2.5 text-sm text-rose-600"></p>

          <div class="flex items-center gap-3 border-t border-slate-100 pt-5">
            <button type="submit"
              class="rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-5 py-2.5 text-sm font-medium text-white shadow-sm shadow-indigo-600/25 transition hover:from-indigo-500 hover:to-violet-500 active:scale-[.98]">保存修改</button>
            <a href="questions.html" class="rounded-xl px-4 py-2.5 text-sm text-slate-600 transition hover:bg-slate-100">取消</a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="assets/app.js"></script>
  <script>
    let db = null;
    let currentId = "";

    function showError(message) {
      const box = document.getElementById("error");
      box.textContent = message;
      box.classList.remove("hidden");
    }

    document.getElementById("question-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      document.getElementById("error").classList.add("hidden");

      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();
      const scoreMin = Number(document.getElementById("scoreMin").value);
      const scoreMax = Number(document.getElementById("scoreMax").value);

      if (!title) return showError("请填写题目标题。");
      if (!Number.isInteger(scoreMin) || !Number.isInteger(scoreMax)) return showError("分值必须是整数。");
      if (scoreMin < 0 || scoreMax < 1) return showError("分值范围不能为负数。");
      if (scoreMin >= scoreMax) return showError("分值下限必须小于上限。");

      const question = db.questions.find((q) => q.id === currentId);
      if (!question) return showError("题目不存在，可能已被删除。");

      Object.assign(question, { title, description, scoreMin, scoreMax });
      saveDB(db);
      flash("题目已更新");
      location.href = "questions.html";
    });

    document.addEventListener("DOMContentLoaded", async () => {
      if (!mountAdmin("questions")) return;
      consumeFlash();
      currentId = getQuery("id");

      try {
        db = await loadDB();
        const question = db.questions.find((q) => q.id === currentId);
        if (!question) {
          document.getElementById("page").innerHTML = `
            <div class="rounded-2xl border border-amber-200 bg-amber-50 p-6">
              <h2 class="font-semibold text-amber-800">题目不存在</h2>
              <p class="mt-2 text-sm text-amber-700">可能已被删除，请返回题库查看。</p>
              <a href="questions.html" class="mt-4 inline-block rounded-xl bg-amber-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-amber-500">返回题库</a>
            </div>`;
          return;
        }

        document.getElementById("title").value = question.title;
        document.getElementById("description").value = question.description || "";
        document.getElementById("scoreMin").value = question.scoreMin;
        document.getElementById("scoreMax").value = question.scoreMax;

        const usedCount = db.surveys.filter((s) => s.questionIds.includes(question.id)).length;
        document.getElementById("usage-hint").textContent =
          `题目 ID：${question.id} · 创建于 ${formatTime(question.createdAt)} · 被 ${usedCount} 份问卷引用`;
      } catch (err) {
        showFatal(err);
      }
    });
  </script>
</body>
</html>
