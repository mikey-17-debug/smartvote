<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理员登录 · 课堂评分投票系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="relative min-h-screen overflow-hidden bg-slate-950 text-slate-100">
  <div class="pointer-events-none absolute inset-0" aria-hidden="true">
    <div class="absolute -left-32 -top-32 h-[28rem] w-[28rem] rounded-full bg-indigo-600/25 blur-3xl"></div>
    <div class="absolute -bottom-32 -right-24 h-[24rem] w-[24rem] rounded-full bg-violet-600/20 blur-3xl"></div>
    <div class="absolute left-1/2 top-1/3 h-64 w-64 -translate-x-1/2 rounded-full bg-sky-500/10 blur-3xl"></div>
  </div>

  <div class="relative flex min-h-screen items-center justify-center px-4 py-10">
    <div class="qc-fade w-full max-w-sm">
      <div class="mb-8 text-center">
        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 text-white shadow-xl shadow-indigo-950/60 ring-1 ring-white/20">
          <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
          </svg>
        </div>
        <h1 class="mt-5 text-xl font-semibold tracking-tight text-white">课堂评分投票系统</h1>
        <p class="mt-1.5 text-sm text-slate-400">管理员登录后台</p>
      </div>

      <form id="login-form" class="rounded-3xl border border-white/10 bg-white/[.06] p-7 shadow-2xl shadow-black/40 backdrop-blur-xl">
        <div class="space-y-5">
          <div>
            <label for="username" class="block text-sm font-medium text-slate-300">用户名</label>
            <input id="username" name="username" type="text" autocomplete="username" required
              class="mt-2 w-full rounded-xl border border-white/10 bg-white/5 px-3.5 py-2.5 text-sm text-white outline-none transition placeholder:text-slate-500 focus:border-indigo-400 focus:bg-white/10 focus:ring-4 focus:ring-indigo-500/20"
              placeholder="请输入管理员用户名" />
          </div>
          <div>
            <label for="password" class="block text-sm font-medium text-slate-300">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required
              class="mt-2 w-full rounded-xl border border-white/10 bg-white/5 px-3.5 py-2.5 text-sm text-white outline-none transition placeholder:text-slate-500 focus:border-indigo-400 focus:bg-white/10 focus:ring-4 focus:ring-indigo-500/20"
              placeholder="请输入密码" />
          </div>
        </div>

        <p id="error" class="mt-4 hidden rounded-xl border border-rose-500/20 bg-rose-500/10 px-3 py-2.5 text-sm text-rose-300"></p>

        <button type="submit" id="submit-btn"
          class="mt-6 w-full rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-4 py-2.5 text-sm font-medium text-white shadow-lg shadow-indigo-950/50 transition hover:from-indigo-500 hover:to-violet-500 active:scale-[.98] disabled:cursor-not-allowed disabled:opacity-60">
          登录
        </button>
      </form>

      <p class="mt-5 text-center text-xs text-slate-500">演示环境：登录态仅保存在当前浏览器会话中</p>
    </div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const errorBox = document.getElementById("error");
      const button = document.getElementById("submit-btn");
      errorBox.classList.add("hidden");
      button.disabled = true;
      button.textContent = "登录中…";

      try {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const ok = await verifyAdmin(username, password);
        if (!ok) {
          errorBox.textContent = "用户名或密码不正确，请重新输入。";
          errorBox.classList.remove("hidden");
          return;
        }
        sessionStorage.setItem(ADMIN_SESSION_KEY, username.trim());
        flash("登录成功");
        location.href = "questions.html";
      } catch (err) {
        showFatal(err);
      } finally {
        button.disabled = false;
        button.textContent = "登录";
      }
    });
  </script>
</body>
</html>
